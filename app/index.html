<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ملقّن — اقرأ بثقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#14110f;--panel:#1e1a17;--line:#2e2824;--text:#f3ece4;--muted:#a39889;--accent:#e2483d;--accent2:#f0a35e;--ok:#7fbf7f;--warn:#f0c75e}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  button{font-family:inherit;font-size:15px;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:#2b2521;color:var(--text)}
  button:active{transform:scale(.97)} button:disabled{opacity:.4}
  .primary{background:var(--accent2);color:#1a120b;font-weight:700}
  .ghost{background:transparent;border:1px solid var(--line)}
  .view{display:none;max-width:720px;margin:0 auto;padding:16px 14px 90px}
  .view.on{display:block}
  .muted{color:var(--muted);font-size:13px;line-height:1.7;margin:0}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .between{justify-content:space-between}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  h1{font-size:26px;margin:4px 0 2px} h2{font-size:17px;margin:0}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-size:20px}
  /* home */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer}
  .card h3{margin:0 0 4px;font-size:16px}
  .card .meta{font-size:12px;color:var(--muted)}
  .empty{text-align:center;padding:40px 10px}
  .empty .big{font-size:44px}
  .fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);box-shadow:0 10px 30px rgba(0,0,0,.5);padding:14px 26px;font-size:16px;border-radius:999px;z-index:5}
  /* editor */
  input.field,textarea.field,select.field{width:100%;font-family:inherit;font-size:15px;background:#100d0b;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}
  textarea.field{min-height:220px;line-height:1.9;font-family:"Noto Naskh Arabic",serif;font-size:18px;resize:vertical}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:8px 13px;border-radius:999px;background:#2b2521;font-size:13px;border:1px solid transparent}
  .chip.sel{background:var(--accent2);color:#1a120b;font-weight:700}
  .sec{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
  .sec:first-child{border-top:0}
  .sec .n{flex:none;width:26px;height:26px;border-radius:8px;background:#2b2521;display:grid;place-items:center;font-size:12px;color:var(--muted)}
  .sec .t{flex:1;font-family:"Noto Naskh Arabic",serif;font-size:15px;line-height:1.8;color:#d9cfc3}
  .sec .d{flex:none;font-size:12px;color:var(--muted);direction:ltr}
  .meter{height:8px;border-radius:4px;background:#100d0b;overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
  .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--accent)}
  /* run */
  #run{max-width:none;padding:0}
  .topbar{position:sticky;top:0;z-index:4;background:rgba(20,17,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
  .topbar .title{font-weight:700;font-size:15px;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .clock{font-variant-numeric:tabular-nums;direction:ltr;font-size:20px;font-weight:500}
  .clock small{font-size:13px;color:var(--muted)}
  .clock.near{color:var(--warn)} .clock.over{color:var(--accent)}
  .modes{display:flex;background:#100d0b;border-radius:10px;padding:3px;gap:3px}
  .modes button{padding:7px 12px;font-size:13px;background:transparent;border-radius:8px}
  .modes button.sel{background:#2b2521;color:var(--accent2);font-weight:700}
  #stage{height:calc(100vh - 200px);height:calc(100dvh - 200px);overflow-y:auto;padding:30vh 18px 60vh;scroll-behavior:smooth}
  #stage.mirror{transform:scaleX(-1)}
  #script{font-family:"Noto Naskh Arabic",serif;line-height:2;max-width:820px;margin:0 auto}
  #script .p{margin:0 0 .9em}
  #script .p .sn{font-family:"IBM Plex Sans Arabic";font-size:11px;color:var(--muted);background:#100d0b;border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:middle;direction:ltr;display:inline-block}
  .w{border-radius:5px;transition:color .2s,background .2s,opacity .2s;opacity:.55}
  .w.done{opacity:.35}
  .w.ok{opacity:.4;color:var(--ok)}
  .w.cur{opacity:1;background:var(--accent2);color:#1a120b}
  .w.next{opacity:1}
  .w.err{opacity:1;color:#fff;background:var(--accent)}
  .w.skip{opacity:1;color:var(--accent);text-decoration:line-through}
  .dock{position:fixed;bottom:0;left:0;right:0;z-index:4;background:rgba(20,17,15,.95);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .go{width:66px;height:66px;border-radius:50%;padding:0;display:grid;place-items:center;border:3px solid #3a322c;background:#2b2521}
  .go span{width:26px;height:26px;border-radius:50%;background:var(--accent);transition:.2s}
  .go.on span{border-radius:6px;width:22px;height:22px}
  .round{width:46px;height:46px;border-radius:50%;padding:0;font-size:17px}
  .round.on{background:#4a3a2c}
  .heard{font-size:12px;color:var(--muted);min-height:18px;text-align:center;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .settings{display:none;margin-top:10px;gap:12px;font-size:13px;color:var(--muted)}
  .settings.show{display:flex;flex-wrap:wrap}
  .settings label{display:flex;align-items:center;gap:6px}
  .fix{position:fixed;left:14px;right:14px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:6;max-width:560px;margin:0 auto;display:none;border:1px solid var(--accent);background:#2a1513;border-radius:16px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .fix.show{display:block}
  .fix h3{margin:0 0 6px;font-size:15px}
  .fix .right{font-family:"Noto Naskh Arabic",serif;font-size:24px;color:var(--ok)}
  .fix .wrong{color:#ff9a90;text-decoration:line-through}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:8;display:none;align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .stat{background:#100d0b;border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px;direction:ltr}
  .stat span{font-size:12px;color:var(--muted)}
  .take{border-top:1px solid var(--line);padding:10px 0}
  .take audio{width:100%;height:36px;margin-top:6px}
  .toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#2b2521;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- ===== الرئيسية ===== -->
<section class="view" id="home">
  <div class="row between">
    <div class="brand"><div class="logo">🎙️</div><div><h1>ملقّن</h1><p class="muted">اقرأ نصك بثقة، والملقّن يمشي مع صوتك</p></div></div>
  </div>
  <div id="list"></div>
  <p class="muted" style="text-align:center;margin-top:26px">نصوصك وتسجيلاتك محفوظة على جهازك فقط · متابعة الصوت أدق في Chrome</p>
  <button class="primary fab" id="newBtn">＋ نص جديد</button>
</section>

<!-- ===== المحرر ===== -->
<section class="view" id="edit">
  <div class="row between"><button class="ghost" id="editBack">→ رجوع</button><button class="ghost" id="delBtn" style="color:#ff9a90">حذف</button></div>
  <label class="lbl">العنوان</label>
  <input class="field" id="tTitle" placeholder="مثال: ريل عن الادخار">
  <label class="lbl">النص — افصل المقاطع بسطر فاضي</label>
  <textarea class="field" id="tText" placeholder="الصق نصك هنا…"></textarea>
  <label class="lbl">المدة المستهدفة</label>
  <div class="chips" id="durChips"></div>
  <div class="panel" style="margin-top:14px">
    <div class="row between"><h2>المقاطع</h2><span class="muted" id="estTotal"></span></div>
    <div class="meter" id="durMeter"><i></i></div>
    <p class="muted" id="durHint" style="margin-top:6px"></p>
    <div id="secs" style="margin-top:6px"></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="primary" id="startBtn" style="flex:1;padding:14px">ابدأ القراءة ←</button></div>
</section>

<!-- ===== القراءة ===== -->
<section class="view" id="run">
  <div class="topbar">
    <div class="row between">
      <button class="ghost" id="runBack" style="padding:8px 12px">→</button>
      <div class="title" id="runTitle"></div>
      <div class="clock" id="clock">0:00 <small id="clockT"></small></div>
    </div>
    <div class="row between" style="margin-top:8px">
      <div class="modes" id="modes">
        <button data-m="follow" class="sel">🎬 متابعة</button>
        <button data-m="practice">📖 تدريب</button>
      </div>
      <span class="muted" id="modeHint" style="font-size:12px"></span>
    </div>
  </div>
  <div id="stage"><div id="script"></div></div>
  <div class="fix" id="fix">
    <h3 id="fixTitle"></h3><div id="fixBody"></div>
    <div class="row" style="margin-top:10px"><button class="primary" id="fixGo">متابعة</button><button id="fixRestart">من البداية</button></div>
  </div>
  <div class="dock">
    <div class="heard" id="heard"></div>
    <div class="row" style="justify-content:center;gap:16px">
      <button class="round" id="recToggle" title="سجّل الصوت">⏺️</button>
      <button class="go" id="goBtn"><span></span></button>
      <button class="round" id="setBtn" title="الإعدادات">⚙️</button>
    </div>
    <div class="settings" id="settings">
      <label>الخط <input type="range" id="fs" min="20" max="48" value="30"></label>
      <label><input type="checkbox" id="mirror"> عكس النص (للملقّن الزجاجي)</label>
      <label id="speedWrap">سرعة التمرير اليدوي <input type="range" id="speed" min="60" max="200" value="130"> <span id="speedV" style="direction:ltr">130</span> كلمة/د</label>
    </div>
  </div>
</section>

<!-- ===== النتيجة ===== -->
<div class="sheet" id="doneSheet"><div class="box">
  <div class="row between"><h2>🎉 انتهت القراءة</h2><button class="ghost" id="doneClose">إغلاق</button></div>
  <div class="stats">
    <div class="stat"><b id="stTime"></b><span>المدة</span></div>
    <div class="stat"><b id="stAcc"></b><span>الدقة</span></div>
    <div class="stat"><b id="stErr"></b><span>ملاحظات</span></div>
  </div>
  <div id="stErrList"></div>
  <div class="row" style="margin-top:10px"><button class="primary" id="againBtn" style="flex:1">مرة ثانية</button><button id="toTakes">التسجيلات</button></div>
</div></div>

<div class="sheet" id="takesSheet"><div class="box">
  <div class="row between"><h2>🎧 تسجيلات هذا النص</h2><button class="ghost" id="takesClose">إغلاق</button></div>
  <p class="muted" style="margin-top:6px">محفوظة على هذا الجهاز فقط.</p>
  <div id="takesList"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ========== أدوات ========== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
const fmtS=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const WPS=2.2; // سرعة الإلقاء التقريبية بالعربي: كلمة/ثانية
function norm(w){return (w||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-يa-z0-9]/g,'')}
const STOP=new Set(['و','في','من','ثم','او','على','الى','ما','هو','هي','هذا','هذه','كل','مع','عن','ان','لا','لم','لن','قد','يا','ب','ل','ف','ك']);
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const strip=w=>w.replace(/^(وال|فال|بال|كال|لل|ال|و|ف|ب)/,'');
function similar(a,b){if(a===b)return true;const A=strip(a),B=strip(b);if(A===B&&A.length>=2)return true;const L=Math.max(A.length,B.length);if(L<4)return false;return 1-lev(A,B)/L>=0.72}
const isContent=t=>t.n.length>=3&&!STOP.has(t.n);

/* ========== التخزين ========== */
const KEY='mulaqqin-scripts';
function loadScripts(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function saveScripts(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){toast('تعذّر الحفظ في هذا المتصفح')}}
let scripts=loadScripts();
const byId=id=>scripts.find(s=>s.id===id);
let dbP=null;
function db(){if(!dbP)dbP=new Promise((res,rej)=>{try{const r=indexedDB.open('mulaqqin',1);r.onupgradeneeded=()=>r.result.createObjectStore('takes',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbP}
async function dbDo(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('takes',mode),st=tx.objectStore('takes');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})}

/* ========== تقسيم النص ========== */
function splitSections(text){
  const paras=text.replace(/\r/g,'').split(/\n\s*\n/).map(p=>p.replace(/\s+/g,' ').trim()).filter(Boolean);
  const out=[];
  for(const p of paras){
    const words=p.split(' ');
    if(words.length<=55){out.push(p);continue}
    // فقرة طويلة: نقسمها على نهايات الجمل
    const sents=p.match(/[^.!؟?…]+[.!؟?…]*/g)||[p];let buf='';
    for(const s of sents){const cand=(buf+' '+s).trim();if(buf&&cand.split(' ').length>40){out.push(buf.trim());buf=s}else buf=cand}
    if(buf.trim())out.push(buf.trim());
  }
  return out;
}
const wc=s=>s.split(/\s+/).filter(w=>norm(w)).length;

/* ========== التنقل ========== */
let cur=null;
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));window.scrollTo(0,0)}
function route(){
  const h=location.hash.slice(1);const [v,id]=h.split('-');
  if(v==='edit'&&byId(id)){cur=byId(id);openEdit()}
  else if(v==='run'&&byId(id)){cur=byId(id);openRun()}
  else{stopAll();show('home');renderHome()}
}
window.addEventListener('hashchange',route);

/* ========== الرئيسية ========== */
function renderHome(){
  const L=$('list');
  if(!scripts.length){L.innerHTML='<div class="empty"><div class="big">📝</div><p>ما عندك نصوص بعد</p><p class="muted">الصق نص الريل أو العرض أو المقطع، وابدأ تقرأ والملقّن يمشي معك.</p></div>';return}
  L.innerHTML='';
  [...scripts].sort((a,b)=>b.updated-a.updated).forEach(s=>{
    const words=wc(s.text),est=words/WPS;
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<h3>${esc(s.title||'بدون عنوان')}</h3><div class="meta">${words} كلمة · تقريبًا ${fmtS(est)}${s.target?' · الهدف '+fmtS(s.target):''}${s.best?' · أفضل دقة '+s.best+'٪':''}</div>`;
    c.onclick=()=>location.hash='edit-'+s.id;L.appendChild(c);
  });
}
$('newBtn').onclick=()=>{const s={id:Date.now().toString(36),title:'',text:'',target:60,created:Date.now(),updated:Date.now()};scripts.push(s);saveScripts(scripts);location.hash='edit-'+s.id};

/* ========== المحرر ========== */
const DURS=[[0,'بدون'],[30,'30 ث'],[60,'60 ث'],[90,'90 ث'],[180,'3 د']];
function openEdit(){
  show('edit');$('tTitle').value=cur.title;$('tText').value=cur.text;
  $('durChips').innerHTML='';
  DURS.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip'+((cur.target||0)===v?' sel':'');b.textContent=l;b.onclick=()=>{cur.target=v;persist();openEditChips()};$('durChips').appendChild(b)});
  renderSecs();
}
function openEditChips(){[...$('durChips').children].forEach((b,i)=>b.classList.toggle('sel',DURS[i][0]===(cur.target||0)));renderSecs()}
function persist(){cur.title=$('tTitle').value.trim();cur.text=$('tText').value;cur.updated=Date.now();saveScripts(scripts)}
let pT;
$('tTitle').oninput=$('tText').oninput=()=>{clearTimeout(pT);pT=setTimeout(()=>{persist();renderSecs()},300)};
function renderSecs(){
  const secs=splitSections($('tText').value);const S=$('secs');S.innerHTML='';let total=0;
  secs.forEach((t,i)=>{const n=wc(t);const d=n/WPS;total+=d;const el=document.createElement('div');el.className='sec';el.innerHTML=`<span class="n">${i+1}</span><span class="t">${esc(t.length>140?t.slice(0,140)+'…':t)}</span><span class="d">~${fmtS(d)}</span>`;S.appendChild(el)});
  if(!secs.length)S.innerHTML='<p class="muted">اكتبي أو الصقي نصك فوق، وبيتقسّم هنا تلقائيًا.</p>';
  $('estTotal').textContent=secs.length?`${secs.length} مقاطع · تقريبًا ${fmtS(total)}`:'';
  const T=cur.target||0,m=$('durMeter');
  if(T&&total){const r=total/T;m.querySelector('i').style.width=Math.min(100,r*100)+'%';m.className='meter'+(r>1.05?' bad':r>0.9?' warn':'');
    $('durHint').textContent=r>1.05?`أطول من الهدف بحوالي ${fmtS(total-T)}، اختصري أو اقرئي أسرع.`:r>0.9?'قريب جدًا من الهدف 👌':`عندك وقت إضافي حوالي ${fmtS(T-total)}.`;}
  else{m.querySelector('i').style.width='0';$('durHint').textContent=total?'التقدير على أساس إلقاء متوسط السرعة.':''}
  $('startBtn').disabled=!secs.length;
}
$('editBack').onclick=()=>{persist();location.hash=''};
$('delBtn').onclick=()=>{const b=$('delBtn');if(!b._c){b._c=true;b.textContent='اضغطي مرة ثانية للتأكيد';setTimeout(()=>{b._c=false;b.textContent='حذف'},3000);return}
  scripts=scripts.filter(s=>s!==cur);saveScripts(scripts);location.hash=''};
$('startBtn').onclick=()=>{persist();location.hash='run-'+cur.id};

/* ========== القراءة ========== */
let tokens=[],ptr=0,pending=[],errors=[],mode='follow',running=false,t0=0,tick=null,lastErrIdx=0,fixOpen=false;
function openRun(){
  show('run');stopAll();$('runTitle').textContent=cur.title||'بدون عنوان';
  $('clockT').textContent=cur.target?'/ '+fmtS(cur.target):'';
  const box=$('script');box.innerHTML='';tokens=[];
  splitSections(cur.text).forEach((sec,si)=>{
    const p=document.createElement('p');p.className='p';p.innerHTML=`<span class="sn">${si+1}</span>`;
    sec.split(/\s+/).forEach(raw=>{const sp=document.createElement('span');sp.className='w';sp.textContent=raw;const n=norm(raw);if(n){sp.dataset.i=tokens.length;tokens.push({disp:raw,n,el:sp})}p.appendChild(sp);p.appendChild(document.createTextNode(' '))});
    box.appendChild(p);
  });
  reset();applyPrefs();updateModeHint();$('clock').firstChild.nodeValue='0:00 ';
}
function reset(){ptr=0;pending=[];errors=[];tokens.forEach(t=>t.el.className='w');hideFix();paint();$('stage').scrollTop=0}
function paint(vis){ // vis = مؤشر تقريبي من النتائج المؤقتة
  const at=vis!=null?vis:ptr;
  tokens.forEach((t,i)=>{t.el.classList.remove('cur','next');if(i<at&&!t.el.classList.contains('ok')&&!t.el.classList.contains('err')&&!t.el.classList.contains('skip'))t.el.classList.add('done')});
  if(tokens[at]){tokens[at].el.classList.add('cur');for(let k=1;k<=6&&tokens[at+k];k++)tokens[at+k].el.classList.add('next');scrollTo(tokens[at].el)}
}
function scrollTo(el){const st=$('stage');const y=el.offsetTop-st.clientHeight*0.32;if(Math.abs(st.scrollTop-y)>8)st.scrollTop=y}
function good(i){const c=tokens[i].el.classList;c.remove('err','skip','done');c.add('ok')}

/* ----- محاذاة الكلام مع النص ----- */
function findAhead(w,from,span){for(let k=0;k<=span;k++){const t=tokens[from+k];if(!t)break;if(similar(w,t.n))return k}return -1}
function feed(text){
  const raws=text.split(/\s+/).filter(w=>norm(w));
  for(const raw of raws){
    if(ptr>=tokens.length)break;const w=norm(raw);
    if(/[0-9]/.test(w)){good(ptr);ptr++;pending=[];continue} // الأرقام تُكتب أحيانًا كأرقام
    const k=findAhead(w,ptr,mode==='follow'?10:5);
    if(k>=0){
      for(let i=ptr;i<ptr+k&&!fixOpen;i++){const t=tokens[i];
        if(!isContent(t)||mode==='follow'){good(i);continue}
        raise(i===ptr&&pending.length?'wrong':'skip',i,pending.join(' '))}
      if(fixOpen){ptr=lastErrIdx;pending=[];paint();break}
      good(ptr+k);ptr+=k+1;pending=[];
    }else{
      pending.push(raw.replace(/[،.,:؛!?؟]/g,''));
      if(pending.length>=3){if(mode==='practice')raise('lost',ptr,pending.join(' '));pending=[]}
    }
    if(fixOpen)break;
  }
  paint();
  if(ptr>=tokens.length&&running)setTimeout(finish,400);
}
function peek(text){ // النتائج المؤقتة: نحرّك المؤشر بصريًا فقط
  if(fixOpen)return;const ws=text.split(/\s+/).map(norm).filter(Boolean);if(!ws.length)return;
  let p=ptr;for(const w of ws){const k=findAhead(w,p,6);if(k>=0)p=p+k+1}
  if(p>ptr)paint(Math.min(p,tokens.length-1));
}
function raise(type,i,said){
  const t=tokens[i];lastErrIdx=i;const word=t.disp.replace(/[،.:,؛…!?؟]+/g,'');
  t.el.classList.remove('done','ok');t.el.classList.add(type==='skip'?'skip':'err');errors.push({type,word,said});
  $('fixTitle').textContent=type==='skip'?'⏸ كلمة ناقصة':type==='wrong'?'⏸ كلمة مختلفة':'⏸ خرجت عن النص';
  $('fixBody').innerHTML=type==='skip'?`<p>نسيت: <span class="right">${esc(word)}</span></p>`:type==='wrong'?`<p>سمعت: <span class="wrong">${esc(said)}</span></p><p>والصحيح: <span class="right">${esc(word)}</span></p>`:`<p>أكمل من: <span class="right">${esc(word)}</span></p>`;
  $('fix').classList.add('show');fixOpen=true;pauseClock();
}
function hideFix(){$('fix').classList.remove('show');fixOpen=false}
$('fixGo').onclick=()=>{hideFix();pending=[];paint();resumeClock();toast('أكمل من الكلمة المظلّلة')};
$('fixRestart').onclick=()=>{hideFix();reset();elapsed=0;if(running){t0=performance.now()}};

/* ----- الوقت ----- */
let elapsed=0,clockOn=false;
function startClock(){elapsed=0;t0=performance.now();clockOn=true;clearInterval(tick);tick=setInterval(drawClock,200)}
function pauseClock(){if(clockOn){elapsed+=performance.now()-t0;clockOn=false}}
function resumeClock(){if(!clockOn&&running){t0=performance.now();clockOn=true}}
function nowMs(){return elapsed+(clockOn?performance.now()-t0:0)}
function drawClock(){const s=nowMs()/1000,T=cur.target||0;$('clock').firstChild.nodeValue=fmtS(s)+' ';$('clock').className='clock'+(T&&s>T?' over':T&&s>T-5?' near':'');
  if(!SR&&running&&clockOn){const wpm=+$('speed').value;const target=Math.floor(s*wpm/60);while(ptr<Math.min(target,tokens.length)){good(ptr);ptr++}paint();if(ptr>=tokens.length)finish()}}

/* ----- التعرّف على الكلام ----- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,want=false;
function listen(){
  if(!SR)return;want=true;try{rec&&rec.abort()}catch(e){}
  rec=new SR();rec.lang='ar-SA';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let part='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){if(!fixOpen)feed(r[0].transcript)}else part+=r[0].transcript}
    $('heard').textContent=part?'🗣️ '+part:'';if(part)peek(part)};
  rec.onend=()=>{if(want)try{rec.start()}catch(e){}};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;toast('اسمحي للمتصفح باستخدام الميكروفون من إعدادات الموقع');stopRun()}};
  try{rec.start()}catch(e){}
}
function unlisten(){want=false;try{rec&&rec.stop()}catch(e){};$('heard').textContent=''}

/* ----- تسجيل الصوت (اختياري) ----- */
let recOn=false,mrec=null,chunks=[],stream=null;
$('recToggle').onclick=()=>{if(running){toast('غيّري هذا قبل البدء');return}recOn=!recOn;$('recToggle').classList.toggle('on',recOn);toast(recOn?'سيُسجَّل صوتك أثناء القراءة ⏺️':'بدون تسجيل')};
async function startRec(){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>window.MediaRecorder?.isTypeSupported?.(m))||'';
    mrec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];mrec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mrec.start(500);
  }catch(e){toast('تعذّر تسجيل الصوت — نكمل بدون تسجيل');recOn=false;$('recToggle').classList.remove('on')}
}
function stopRec(save){return new Promise(res=>{if(!mrec||mrec.state==='inactive'){res(null);return}
  mrec.onstop=async()=>{stream?.getTracks().forEach(t=>t.stop());if(!save){res(null);return}
    const blob=new Blob(chunks,{type:mrec.mimeType||'audio/webm'});
    try{await dbDo('readwrite',st=>st.put({id:Date.now()+'',script:cur.id,created:Date.now(),ms:nowMs(),type:blob.type,buf:null,blob}))}catch(e){try{const buf=await blob.arrayBuffer();await dbDo('readwrite',st=>st.put({id:Date.now()+'',script:cur.id,created:Date.now(),ms:nowMs(),type:blob.type,buf}))}catch(x){toast('تعذّر حفظ التسجيل')}}
    res(blob)};mrec.stop()})}

/* ----- تشغيل وإيقاف ----- */
$('goBtn').onclick=async()=>{
  if(running){stopRun();return}
  reset();running=true;$('goBtn').classList.add('on');
  listen(); // لازم يبدأ مباشرة من الضغطة
  if(recOn)await startRec();
  startClock();
  if(!SR)toast('التمرير تلقائي بالسرعة المختارة (المتصفح لا يدعم متابعة الصوت)');
};
async function stopRun(){if(!running)return;running=false;pauseClock();clearInterval(tick);drawClock();unlisten();$('goBtn').classList.remove('on');await stopRec(true)}
async function finish(){if(!running)return;await stopRun();showDone()}
function stopAll(){if(running){running=false;clearInterval(tick);unlisten();stopRec(false)}hideFix()}
function showDone(){
  const s=nowMs()/1000,content=tokens.filter(isContent).length||1,acc=Math.max(0,Math.round(100*(1-errors.length/content)));
  $('stTime').textContent=fmtS(s);$('stAcc').textContent=(SR?acc+'%':'—');$('stErr').textContent=SR?errors.length:'—';
  $('stErrList').innerHTML=errors.length?'<p class="muted">راجع هذه الكلمات:</p>'+errors.map(e=>`<span class="chip" style="display:inline-block;margin:3px">${esc(e.word)}</span>`).join(''):(SR?'<p class="muted">قراءة نظيفة 👏</p>':'');
  if(SR&&mode==='practice'&&(!cur.best||acc>cur.best)){cur.best=acc;saveScripts(scripts)}
  if(cur.target&&s>cur.target+1)$('stErrList').innerHTML+=`<p class="muted" style="color:var(--warn)">تجاوزت المدة المستهدفة بـ ${fmtS(s-cur.target)}.</p>`;
  $('doneSheet').classList.add('show');
}
$('doneClose').onclick=()=>$('doneSheet').classList.remove('show');
$('againBtn').onclick=()=>{$('doneSheet').classList.remove('show');reset();$('clock').firstChild.nodeValue='0:00 '};
$('toTakes').onclick=()=>{$('doneSheet').classList.remove('show');openTakes()};
async function openTakes(){
  const L=$('takesList');L.innerHTML='';let all=[];try{all=(await dbDo('readonly',st=>st.getAll())).filter(t=>t.script===cur.id).sort((a,b)=>b.created-a.created)}catch(e){}
  if(!all.length)L.innerHTML='<p class="muted" style="margin-top:10px">ما فيه تسجيلات. فعّل ⏺️ قبل ما تبدأ القراءة.</p>';
  all.forEach((t,i)=>{const blob=t.blob||new Blob([t.buf],{type:t.type});const url=URL.createObjectURL(blob);const ext=/mp4/.test(t.type)?'m4a':'webm';
    const el=document.createElement('div');el.className='take';
    el.innerHTML=`<div class="row between"><b>تسجيل ${all.length-i}</b><span class="muted">${fmtS(t.ms/1000)} · ${new Date(t.created).toLocaleString('ar-SA',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</span></div><audio controls src="${url}"></audio><div class="row"><a download="${esc((cur.title||'تسجيل')+'-'+(all.length-i))}.${ext}" href="${url}"><button>⬇️ تنزيل</button></a><button data-del>🗑 حذف</button></div>`;
    el.querySelector('[data-del]').onclick=async()=>{await dbDo('readwrite',st=>st.delete(t.id));el.remove()};L.appendChild(el)});
  $('takesSheet').classList.add('show');
}
$('takesClose').onclick=()=>$('takesSheet').classList.remove('show');

/* ----- الأوضاع والإعدادات ----- */
$('modes').onclick=e=>{const b=e.target.closest('button');if(!b||running)return;mode=b.dataset.m;[...$('modes').children].forEach(x=>x.classList.toggle('sel',x===b));updateModeHint();reset()};
function updateModeHint(){$('modeHint').textContent=!SR?'متابعة الصوت غير مدعومة هنا — تمرير تلقائي':mode==='follow'?'النص يمشي مع صوتك':'يتوقف عند أي خطأ'}
$('setBtn').onclick=()=>{$('settings').classList.toggle('show');$('setBtn').classList.toggle('on')};
const PREF='mulaqqin-prefs';
function applyPrefs(){let p={};try{p=JSON.parse(localStorage.getItem(PREF)||'{}')}catch(e){}
  $('fs').value=p.fs||30;$('mirror').checked=!!p.mirror;$('speed').value=p.speed||130;$('speedV').textContent=$('speed').value;
  $('script').style.fontSize=$('fs').value+'px';$('stage').classList.toggle('mirror',$('mirror').checked);$('speedWrap').style.display=SR?'none':'flex'}
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify({fs:+$('fs').value,mirror:$('mirror').checked,speed:+$('speed').value}))}catch(e){}applyPrefs()}
['fs','mirror','speed'].forEach(i=>$(i).addEventListener('input',savePrefs));
$('runBack').onclick=()=>{stopAll();location.hash='edit-'+cur.id};

/* ----- أول تشغيل: نص تجريبي ----- */
if(!scripts.length&&!localStorage.getItem('mulaqqin-seeded')){
  scripts.push({id:'demo',title:'نص تجريبي: ريل عن الادخار',target:30,created:Date.now(),updated:Date.now(),
    text:'هل تعرف إن ريالًا واحدًا تدّخره اليوم ممكن يكبر أكثر مما تتوقع؟\n\nالسر مو في المبلغ، السر في الاستمرار. خصّص جزءًا بسيطًا من دخلك كل شهر، حتى لو كان صغيرًا.\n\nومع الوقت يصير هذا الجزء عادة، والعادة تصير أمانًا لك ولعائلتك.\n\nابدأ اليوم، ولو بريال واحد.'});
  saveScripts(scripts);try{localStorage.setItem('mulaqqin-seeded','1')}catch(e){}
}
route();
</script>
</body>
